name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma Client generieren
        run: npm run prisma:generate --workspace=apps/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Typecheck (shared)
        run: npm run typecheck --workspace=packages/shared

      # @verkaufs-app/shared zeigt in package.json (main/types) auf dist/,
      # nicht mehr auf src/ (noetig, damit das Paket auch ausserhalb des
      # Monorepo-Kontexts, z.B. beim Firebase-Functions-Deploy, aufloesbar
      # ist) - andere Workspaces koennen es daher erst nach diesem Build-
      # Schritt importieren.
      - name: Build (shared)
        run: npm run build --workspace=packages/shared

      - name: Typecheck (backend)
        run: npm run typecheck --workspace=apps/backend

      - name: Typecheck (mobile)
        run: npm run typecheck --workspace=apps/mobile

      # Tests laufen teils echt gegen Postgres (bewusste Testphilosophie
      # dieses Projekts, siehe apps/backend/src/services/guest-usage.test.ts)
      # – braucht DATABASE_URL + JWT_SECRET als Repo-Secrets. Alle anderen
      # Umgebungsvariablen sind optional (siehe config/env.ts) und bleiben leer.
      - name: Tests (backend)
        run: npm run test --workspace=apps/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
